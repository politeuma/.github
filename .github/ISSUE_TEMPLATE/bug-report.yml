name: Bug report
description: Something broken, wrong, or out of date.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, versions, and minimal input. Logs welcome.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version, tag, or commit hash you ran.
