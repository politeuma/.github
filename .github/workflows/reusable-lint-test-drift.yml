# Reusable CI for politeuma repos: lint + test + drift-watch.

name: lint-test-drift

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for lint and test jobs.
        default: "3.12"
        required: false
        type: string
      lint-command:
        description: Command that runs the repo's lint.
        default: uv run ruff check .
        required: false
        type: string
      test-command:
        description: Command that runs the repo's test suite.
        default: uv run pytest -q
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint
        run: ${{ inputs.lint-command }}
      - name: Test
        run: ${{ inputs.test-command }}

  drift-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for stale review dates
        run: |
          if grep -rn "review_by" --include="*.yml" --include="*.yaml" --include="*.json" . | awk -F'review_by[^0-9]*' '{print $2}' | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}' | while read -r d; do [ "$d" "<" "$(date +%F)" ] && echo "STALE: $d"; done | grep -q STALE; then
            echo "::warning::Some review_by dates are past. See profile/glossary.md (review_by) and open a grounding proposal to re-check them."
          else
            echo "No stale review_by dates found."
          fi
